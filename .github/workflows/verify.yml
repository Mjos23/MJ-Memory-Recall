name: Verify standalone package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the pinned offline package set
        run: python -m pip install --no-index --find-links wheels mj-memory-recall==0.1.0
      - name: Verify installed source matches this checkout
        run: |
          python -B - <<'PYCODE'
          from pathlib import Path
          import mj_memory_recall
          installed = Path(mj_memory_recall.__file__).resolve().parent
          source = Path('src/mj_memory_recall')
          assert 'site-packages' in installed.parts, installed
          for path in source.rglob('*'):
              if path.is_file() and '__pycache__' not in path.parts:
                  assert path.read_bytes() == (installed / path.relative_to(source)).read_bytes(), path
          print('Installed package matches the preserved source tree')
          PYCODE
      - name: Run the complete standalone regression suite
        run: python -B -m unittest discover -s tests -v
