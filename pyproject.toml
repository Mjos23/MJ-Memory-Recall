[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mj-memory-recall"
version = "0.1.0"
description = "Native Bangel episodic and playbook memory recall for the MJ ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Michael Patrick Bangel"}]
dependencies = ["bangel-language==0.2.0rc1"]

[project.scripts]
mj-memory-recall = "mj_memory_recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mj_memory_recall = ["source/*.bangel", "data/*.json", "data/families/*.json", "data/formations/*.json", "examples/*.json", "examples/*.bangel"]
